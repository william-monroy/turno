name: docs

# The documentation site (apps/docs). It runs only when the site, the docs it is written from,
# or the code its reference is generated from change, so it never slows the main checks down.
on:
  push:
    branches: [main]
    paths: &paths
      - "apps/docs/**"
      - "docs/**"
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site (generated pages, build, links)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The reference is generated from the built CLI.
      - run: pnpm build
      - name: Generated pages match the code
        run: pnpm --filter turno-docs run generate:check
      - name: Build the site
        run: pnpm docs:build
      - name: Internal links and anchors
        run: pnpm --filter turno-docs run links

  recordings:
    name: recordings (VHS tapes still run)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Installs vhs with ttyd and ffmpeg; without a tape it records nothing.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
      # Every tape runs turno demo in throwaway HOMEs under /tmp. Ports, pids and times differ
      # between runs, so the result is uploaded for review, not compared with the committed files.
      - name: Render the tapes
        run: pnpm docs:tapes
        env:
          VHS_NO_SANDBOX: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recordings
          path: apps/docs/content/recordings/
          if-no-files-found: error
          retention-days: 14
