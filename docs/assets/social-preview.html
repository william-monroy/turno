<!doctype html>
<!-- Social preview (Settings > Social preview). Render at 1280x640 with a device scale of 2
     (docs/social-preview.md): one conversation that keeps going while the switch below it
     moves from one account to the other. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=block">
<style>
  :root{--bg:#0F0F17;--fg:#F4F4F7;--muted:#A6A9BF;--accent2:#8FAEFF}
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
  .dots{position:absolute;inset:0;background-image:radial-gradient(circle,#1C1F30 1.6px,transparent 1.7px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 50%,#000 30%,transparent 80%)}
  .l{position:absolute;left:88px;top:76px;bottom:76px;width:760px;display:flex;flex-direction:column;justify-content:space-between}
  .l img{height:96px;align-self:flex-start;margin-left:-6px}
  h1{margin:0;font-size:72px;line-height:1.06;font-weight:650;letter-spacing:-2px}
  h1 em{font-style:normal;color:var(--accent2)}
  .sub{font-size:36px;color:var(--muted);letter-spacing:-.3px}
  svg.d{position:absolute;right:78px;top:96px;width:340px;height:448px}
</style></head><body><div class="dots"></div>
<div class="l"><img src="logo-dark.svg" alt="turno"><h1>Switch accounts.<br>Keep <em>everything else.</em></h1><div class="sub">Switching accounts? Keep talking.</div></div>
<svg class="d" viewBox="0 0 340 448" aria-hidden="true">
  <!-- the conversation -->
  <rect x="2" y="2" width="336" height="300" rx="32" fill="#161A2B" stroke="#2A3150" stroke-width="4"/>
  <rect x="34" y="40" width="200" height="44" rx="22" fill="#26396F"/>
  <rect x="122" y="102" width="184" height="44" rx="22" fill="#2457F5"/>
  <rect x="34" y="164" width="232" height="44" rx="22" fill="#324F9E"/>
  <rect x="146" y="226" width="160" height="44" rx="22" fill="#4C7DFF"/>
  <!-- the account switch: off on the left (one account), on the right (the other) -->
  <rect x="58" y="344" width="224" height="104" rx="52" fill="#2457F5"/>
  <circle cx="110" cy="396" r="30" fill="#26396F"/>
  <circle cx="230" cy="396" r="40" fill="#F4F4F7"/>
</svg></body></html>
