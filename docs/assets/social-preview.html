<!doctype html>
<!-- Social preview (Settings > Social preview). Render at 1280x640 with a device scale of 2
     (docs/social-preview.md). The background is the landing page's hero (turno.wimo.dev): three
     curtains of glyphs, one per account, captured without the thread. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=block">
<style>
  :root{--paper:#07080A;--ink:#F1F2F4;--dim:#9DA3AE;--keep:#6A93FF;--work:#A892FF;--third:#F0A13A;--personal:#3FCF87}
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
  .sky{position:absolute;inset:0;width:1280px;height:640px}
  /* Hides the hero's side rail and the edge of the site header the capture carries. */
  .mask-top{position:absolute;left:0;top:0;width:1280px;height:2px;background:var(--paper)}
  .mask-rail{position:absolute;left:18px;top:500px;width:16px;height:140px;background:var(--paper)}
  .acct{position:absolute;padding:2px 6px;font-family:"Geist Mono",monospace;font-size:13px;letter-spacing:.08em}
  .copy{position:absolute;left:72px;top:196px;width:820px;display:flex;flex-direction:column}
  .copy img{width:150px;height:50px;margin:0 0 26px -7px}
  h1{margin:0;font-size:80px;font-weight:500;line-height:.98;letter-spacing:-.045em}
  h1 em{font-style:normal;color:var(--keep)}
  .hook{margin:22px 0 0;font-size:32px;font-weight:500;line-height:1.2;letter-spacing:-.02em}
  .agents{position:absolute;left:72px;bottom:40px;margin:0;font-family:"Geist Mono",monospace;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
</style></head><body>
<img class="sky" src="social-preview-aurora.jpg" alt="">
<div class="mask-top"></div><div class="mask-rail"></div>
<span class="acct" style="left:556px;top:128px;color:var(--work)">WORK</span>
<span class="acct" style="left:846px;top:204px;color:var(--third)">CLIENT</span>
<span class="acct" style="left:1088px;top:432px;color:var(--personal)">PERSONAL</span>
<div class="copy"><img src="logo-dark.svg" alt="turno"><h1>Switch accounts.<br>Keep <em>everything else</em>.</h1><p class="hook">Switching accounts? Keep talking.</p></div>
<p class="agents">Claude Code · Codex · Copilot CLI · Cursor CLI</p>
</body></html>
