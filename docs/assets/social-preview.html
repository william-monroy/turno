<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;background:#0f0f17;color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
  .wrap{padding:84px 96px;box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .logo img{height:84px}
  h1{font-size:52px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-1px;max-width:1050px}
  h1 em{font-style:normal;color:#a89aff}
  .row{display:flex;gap:56px;align-items:flex-end}
  .stat b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:46px;letter-spacing:-1px}
  .stat span{font-size:22px;color:#b4b4c4}
  .stat.dim b{color:#8a8aa0;text-decoration:line-through;text-decoration-thickness:3px}
  .arrow{font-size:46px;color:#7C5CFF;padding-bottom:30px}
  .agents{font-family:ui-monospace,Menlo,monospace;font-size:22px;color:#b4b4c4}
</style></head><body><div class="wrap">
  <div class="logo"><img src="logo-dark.svg" alt=""></div>
  <h1>One MCP gateway and per-folder accounts for <em>every coding agent</em></h1>
  <div class="row">
    <div class="stat dim"><b>3,163 MiB</b><span>8 sessions, each with its own servers</span></div>
    <div class="arrow">&rarr;</div>
    <div class="stat"><b>847 MiB</b><span>the same sessions behind turno</span></div>
  </div>
  <div class="agents">Claude Code · Codex · Copilot CLI · Cursor CLI &nbsp;&nbsp; npx turno@latest</div>
</div></body></html>
