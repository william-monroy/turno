packages:
  - packages/*

# Supply-chain settings (https://pnpm.io/supply-chain-security). pnpm rejects unknown keys.
# Wait three days before installing a newly published version (minutes). The workspace's own
# packages (turno-cli, turno-browser, turno-fonts) are linked with workspace:, never downloaded,
# so they need no minimumReleaseAgeExclude entry.
minimumReleaseAge: 4320
# Fail when a package that had provenance loses it in a newer version.
trustPolicy: no-downgrade
# Refuse to install on a Node version outside "engines".
engineStrict: true
