packages:
  - packages/*

# Supply-chain settings (https://pnpm.io/supply-chain-security). pnpm rejects unknown keys.
# Wait three days before installing a newly published version (minutes).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - turno
  - turno-browser
  - turno-fonts
# Fail when a package that had provenance loses it in a newer version.
trustPolicy: no-downgrade
# Refuse to install on a Node version outside "engines".
engineStrict: true
